spring.application.name=hostly-reservas-service
server.port=8082

# // 1. Configuración de Base de Datos (Supabase)
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=

# 2. Configuración de JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CAMBIADO A NONE: Ahora Flyway manda en la base de datos
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=db_reservas

# 3. Flyway CONFIGURADO Y ACTIVADO
spring.flyway.enabled=true
spring.flyway.default-schema=db_reservas
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# 4. Logs y Colores
logging.level.root=INFO
logging.level.org.hibernate.SQL=DEBUG
spring.output.ansi.enabled=ALWAYS
spring.application.name=hostly-reservas-service
server.port=8082

# Logs y Estilos de Consola
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.root=INFO
spring.output.ansi.enabled=ALWAYS

# Configuración de Base de Datos (Supabase)

spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=

# Evita que Spring intente buscar archivos data.sql viejos al arrancar
spring.sql.init.mode=never

# No se indica ningún archivo data.sql para cargar datos iniciales
spring.sql.init.data-locations=

# Configuración de JPA / Hibernate
spring.jpa.defer-datasource-initialization=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=db_reservas

#Configuración de Flyway (Migraciones de Reservas)
spring.flyway.enabled=true
spring.flyway.default-schema=db_reservas
spring.flyway.schemas=db_reservas
spring.flyway.locations=classpath:db/migration


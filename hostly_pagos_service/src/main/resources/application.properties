spring.application.name=hostly-pagos-service
server.port=8083

spring.datasource.url=jdbc:postgresql://db.fntbzznwdanouuqpzxfv.supabase.co:5432/postgres?currentSchema=db_pagos
spring.datasource.username=postgres
spring.datasource.password=Hostly.pets26
spring.datasource.driver-class-name=org.postgresql.Driver

# Cambiado a none para que Flyway mande en la BD
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.default_schema=db_pagos
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# --- LÍNEAS DE FLYWAY AÑADIDAS ---
spring.flyway.enabled=true
spring.flyway.default-schema=db_pagos
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
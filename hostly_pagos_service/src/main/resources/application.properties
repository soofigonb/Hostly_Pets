spring.application.name=hostly-pagos-service
server.port=8083

# 1. Configuración de Base de Datos (Supabase)

spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=

# Evita que Spring intente buscar archivos data.sql viejos al arrancar
spring.sql.init.mode=never

# 2. Configuración de JPA / Hibernate

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#VALIDATE: Asegura que tus entidades Java calcen perfecto con tus tablas de db_pagos
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=db_pagos

# Desactiva la alerta molesta de open-in-view en la consola
spring.jpa.open-in-view=false

# 3. Configuración de Flyway (Migraciones de Pagos)

spring.flyway.enabled=true
spring.flyway.default-schema=db_pagos
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# 4. Logs y Estilos de Consola
logging.level.root=INFO
logging.level.org.hibernate.SQL=INFO
spring.output.ansi.enabled=ALWAYS